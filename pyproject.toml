[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "strathmark"
version = "1.0.0"
description = "Woodchopping handicap engine — pip-installable calculation core extracted from STRATHEX"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
    { name = "Alex Kaper", email = "alex.j.kaper@gmail.com" }
]
keywords = ["woodchopping", "handicap", "axemen", "sports", "monte-carlo"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Software Development :: Libraries",
    "Intended Audience :: Developers",
]

# Base dependencies — only what is imported at module load time by the
# strathmark package and required for core handicap calculation.
# Heavy ML/DB dependencies are lazily imported and live in optional extras.
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "requests>=2.28",
    "openpyxl>=3.1",
    "ulid-py>=1.1",
]

[project.optional-dependencies]
api = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
]
llm = [
    "ollama>=0.3",
    # Cloud fallback for race-day deployments where Ollama is not reachable.
    # Lazy-imported in strathmark/llm.py — missing package is a graceful no-op.
    "google-generativeai>=0.8",
]
ml = [
    "xgboost>=2.0",
    "lightgbm>=4.0",
    "scikit-learn>=1.3",
]
db = [
    "supabase>=2.0",
]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.4",
    "openpyxl>=3.1",
]

[project.urls]
"Homepage" = "https://github.com/SquirmyWormy275/STRATHMARK"
"Source" = "https://github.com/SquirmyWormy275/STRATHMARK"
"Issues" = "https://github.com/SquirmyWormy275/STRATHMARK/issues"
"Documentation" = "https://github.com/SquirmyWormy275/STRATHMARK/tree/main/docs/wiki"
"Changelog" = "https://github.com/SquirmyWormy275/STRATHMARK/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["strathmark"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.coverage.run]
source = ["strathmark"]
omit = ["tests/*"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
# E501: long lines that ruff format already shaped as best it can
#       (long log strings, URLs, docstring tables)
# E402: module-level imports placed after other statements
#       (intentional late imports in predictor.py / variance.py / wood.py
#        to avoid circular dependencies and to gate optional ML deps)
# F841: assigned-but-unused locals
#       (test cases that bind a result for clarity without asserting on it)
ignore = ["E501", "E402", "F841"]

[tool.ruff.lint.per-file-ignores]
# Re-export shims and lazy import probes
"strathmark/predictor.py" = ["F401"]
