[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "strathmark"
version = "0.1.0"
description = "Woodchopping handicap engine — pip-installable calculation core extracted from STRATHEX"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
authors = [
    { name = "John Ruffato Startup Challenge" }
]
keywords = ["woodchopping", "handicap", "axemen", "sports", "monte-carlo"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Intended Audience :: Developers",
]

dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "scipy>=1.10",
    "xgboost>=2.0",
    "scikit-learn>=1.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]

[project.urls]
"Source" = "https://github.com/placeholder/strathmark"

[tool.hatch.build.targets.wheel]
packages = ["strathmark"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.coverage.run]
source = ["strathmark"]
omit = ["tests/*"]
