[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "strathmark"
version = "3.0.0rc1"
description = "Offline woodchopping handicap engine with trusted V2 and an auditable V3 adaptive-ensemble release candidate"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
    { name = "Alex Kaper", email = "alex.j.kaper@gmail.com" }
]
keywords = ["woodchopping", "handicap", "axemen", "sports", "ensemble", "audit"]
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Software Development :: Libraries",
    "Intended Audience :: Developers",
]

# Base dependencies — only what is imported at module load time by the
# strathmark package and required for core handicap calculation.
# Heavy ML/DB dependencies are lazily imported and live in optional extras.
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "requests>=2.28",
    "openpyxl>=3.1",
    "ulid-py>=1.1",
]

[project.optional-dependencies]
api = [
    "fastapi>=0.110",
    "httpx>=0.27,<1",
    "httpx2>=2.0",
    "uvicorn[standard]>=0.29",
    "cryptography>=43,<47",
]
llm = [
    "ollama>=0.3",
    # Cloud fallback for race-day deployments where Ollama is not reachable.
    # Lazy-imported in strathmark/llm.py — missing package is a graceful no-op.
    "google-generativeai>=0.8",
]
ml = [
    "catboost>=1.2",
    "xgboost>=2.0",
    "lightgbm>=4.0",
    "scikit-learn>=1.3",
]
db = [
    "supabase>=2.0",
]
security = [
    # Loaded lazily by V3 integrity adapters; core V2 imports remain dependency-free.
    "cryptography>=43,<47",
]
dev = [
    "build>=1.2",
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "hypothesis>=6.100",
    "jsonschema>=4.18",
    "ruff>=0.4",
    "openpyxl>=3.1",
    "cryptography>=43,<47",
]

[project.urls]
"Homepage" = "https://github.com/SquirmyWormy275/STRATHMARK"
"Source" = "https://github.com/SquirmyWormy275/STRATHMARK"
"Issues" = "https://github.com/SquirmyWormy275/STRATHMARK/issues"
"Documentation" = "https://github.com/SquirmyWormy275/STRATHMARK/tree/main/docs/wiki"
"Changelog" = "https://github.com/SquirmyWormy275/STRATHMARK/blob/main/CHANGELOG.md"

[project.scripts]
strathmark-v3-factory-evaluator = "strathmark.v3.factory.evaluator_cli:main"

[tool.hatch.build.targets.wheel]
packages = ["strathmark"]

[tool.hatch.build.targets.wheel.force-include]
"strathmark/models/prediction_v2_core.json" = "strathmark/models/prediction_v2_core.json"
"strathmark/contracts/shadow_consumer_v1.openapi.json" = "strathmark/contracts/shadow_consumer_v1.openapi.json"
"strathmark/contracts/shadow_consumer_v1.openapi.sha256" = "strathmark/contracts/shadow_consumer_v1.openapi.sha256"
"strathmark/v3/native/optimizer_kernel.rs" = "strathmark/v3/native/optimizer_kernel.rs"
"strathmark/v3/native/optimizer_kernel_manifest.json" = "strathmark/v3/native/optimizer_kernel_manifest.json"
"strathmark/v3/native/strathmark_v3_optimizer_kernel.dll" = "strathmark/v3/native/strathmark_v3_optimizer_kernel.dll"
"strathmark/v3/contracts/v3_consumer.openapi.json" = "strathmark/v3/contracts/v3_consumer.openapi.json"
"strathmark/v3/contracts/v3_consumer.openapi.sha256" = "strathmark/v3/contracts/v3_consumer.openapi.sha256"
"benchmarks/v3/windows_capacity_manifest.json" = "strathmark/v3/contracts/windows_capacity_manifest.json"
"requirements/v3-release.lock" = "strathmark/v3/contracts/v3-release.lock"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.coverage.run]
source = ["strathmark"]
omit = ["tests/*"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
# E501: long lines that ruff format already shaped as best it can
#       (long log strings, URLs, docstring tables)
# E402: module-level imports placed after other statements
#       (intentional late imports in predictor.py / variance.py / wood.py
#        to avoid circular dependencies and to gate optional ML deps)
# F841: assigned-but-unused locals
#       (test cases that bind a result for clarity without asserting on it)
ignore = ["E501", "E402", "F841"]

[tool.ruff.lint.per-file-ignores]
# Re-export shims and lazy import probes
"strathmark/predictor.py" = ["F401"]
