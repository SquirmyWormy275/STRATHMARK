version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    # Keep branch cleanup stable: security updates stay enabled; version upgrades are reviewed manually.
    open-pull-requests-limit: 0
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: pip
    directory: /
    # Keep branch cleanup stable: security updates stay enabled; version upgrades are reviewed manually.
    open-pull-requests-limit: 0
    schedule:
      interval: monthly
    groups:
      security:
        applies-to: security-updates
        patterns: ["*"]
      development:
        patterns: ["pytest*", "ruff", "build", "hatchling", "hypothesis", "jsonschema"]
        update-types: [minor, patch]
