version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    groups:
      development:
        patterns: ["pytest*", "ruff", "build", "hatchling", "hypothesis", "jsonschema"]
        update-types: [minor, patch]
