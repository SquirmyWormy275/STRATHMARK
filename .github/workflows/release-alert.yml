name: Release failure alerts

on:
  workflow_run:
    workflows: [CI, Publish to PyPI]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: strathmark-release-alert-${{ github.event.workflow_run.name }}
  cancel-in-progress: false

jobs:
  alert:
    if: >-
      github.event.workflow_run.head_repository.full_name == github.repository &&
      (github.event.workflow_run.conclusion == 'failure' ||
       github.event.workflow_run.conclusion == 'timed_out' ||
       github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Open or recover the owner-assigned release alert
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -m scripts.report_release_failure
