name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ruff
        run: pip install ruff

      - name: Ruff check
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .

  test:
    name: Test (${{ matrix.os }} / Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install portable test dependencies
        run: pip install -e ".[dev,api]"

      # The exact release lock describes the designated Python 3.13 rehearsal
      # machine; it is not a cross-version constraints file (for example, its
      # NumPy pin intentionally has no Python 3.10 build).
      - name: Install designated release lock
        if: matrix.python-version == '3.13'
        run: pip install -r requirements/v3-release.lock

      - name: Check dependency consistency
        run: pip check

      - name: Verify distribution imports
        run: python -c "import strathmark; import strathmark.v3"

      - name: Run pytest with coverage
        # Supabase-backed db tests are gated behind STRATHMARK_TEST_DB and
        # skip by default. ML predictor paths fall back to baseline when
        # xgboost/lightgbm/sklearn are not installed (they live in the [ml]
        # extra and are not pulled in by [dev]).
        env:
          STRATHMARK_TEST_DB: "1"
          STRATHMARK_DB_PATH: ${{ runner.temp }}/strathmark-v2-test.sqlite3
          STRATHMARK_V3_DB_PATH: ${{ runner.temp }}/strathmark-v3-test.sqlite3
          STRATHMARK_V3_TEMP_PATH: ${{ runner.temp }}/strathmark-v3-runtime
          STRATHMARK_V3_BLOB_ROOT: ${{ runner.temp }}/strathmark-v3-blobs
          STRATHMARK_V3_BUNDLE_ROOT: ${{ runner.temp }}/strathmark-v3-bundles
          STRATHMARK_V3_ARCHIVE_ROOT: ${{ runner.temp }}/strathmark-v3-archive
          STRATHMARK_V3_BACKUP_ROOT: ${{ runner.temp }}/strathmark-v3-backup
          STRATHMARK_V3_RECOVERY_ROOT: ${{ runner.temp }}/strathmark-v3-recovery
          STRATHMARK_V3_INTEGRITY_KEY_ROOT: ${{ runner.temp }}/strathmark-v3-integrity-keys
          STRATHMARK_REQUIRE_FORMULA_ENGINE_VERIFICATION: "0"
        # The normal distribution and trusted V2 engine remain supported on
        # Python 3.10-3.13. V3's SQLite authority and exact release lock are a
        # designated Python 3.13 runtime contract: older bundled SQLite builds
        # reject its JSON expression indexes when trusted_schema is correctly
        # disabled. Python 3.13 runs the complete suite here and again in the
        # dedicated V3 rehearsal; older interpreters run every non-V3 test.
        run: pytest tests/ -v --tb=short --cov=strathmark --cov-report=term-missing --basetemp=${{ runner.temp }}/strathmark-tests -p no:cacheprovider ${{ matrix.python-version != '3.13' && '--ignore=tests/v3' || '' }}

  v3-ocean-boil:
    name: V3 ocean-boil rehearsal (${{ matrix.os }} / Python 3.13)
    runs-on: ${{ matrix.os }}
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install complete V3 test dependencies
        run: |
          pip install -e ".[dev,api]"
          pip install -r requirements/v3-release.lock

      - name: Check dependency consistency
        run: pip check

      # Executable release evidence is deliberately bound to the originating
      # Windows host, Python executable, installed wheel bytes, and machine
      # receipts. CI reruns the portable gates and the full verifier test suite;
      # it must not weaken or pretend to reproduce the machine-bound attestation.
      - name: Verify deterministic replay and frozen consumer contract
        env:
          STRATHMARK_TEST_DB: "1"
          STRATHMARK_DB_PATH: ${{ runner.temp }}/strathmark-v2-v3-rehearsal.sqlite3
          STRATHMARK_V3_DB_PATH: ${{ runner.temp }}/strathmark-v3-rehearsal.sqlite3
        run: |
          python scripts/replay_v3.py
          python scripts/freeze_v3_consumer_contract.py --check

      - name: Run V3 suite with isolated databases and artifact roots
        env:
          STRATHMARK_TEST_DB: "1"
          STRATHMARK_DB_PATH: ${{ runner.temp }}/strathmark-v2-v3-tests.sqlite3
          STRATHMARK_V3_DB_PATH: ${{ runner.temp }}/strathmark-v3-tests.sqlite3
          STRATHMARK_REQUIRE_FORMULA_ENGINE_VERIFICATION: "0"
        run: pytest tests/v3 -v --tb=short --basetemp=${{ runner.temp }}/strathmark-v3-ocean-boil -p no:cacheprovider

  api:
    name: API contract (${{ matrix.compatible-set }})
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        compatible-set: [oldest, current]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install oldest compatible API dependency set
        if: matrix.compatible-set == 'oldest'
        run: pip install -e ".[dev,api]" -r requirements/api-oldest.txt

      - name: Install current compatible API dependency set
        if: matrix.compatible-set == 'current'
        run: pip install -e ".[dev,api]" -r requirements/api-current.txt

      - name: Check dependency consistency
        run: pip check

      - name: Run API contract tests
        run: pytest tests/test_api.py tests/test_shadow_api.py tests/test_shadow_consumer_contract.py -v --tb=short

  optional-ml:
    name: Optional ML artifact and promotion gates (Ubuntu / Python 3.12)
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package with optional ML dependencies
        run: pip install -e ".[dev,ml]"

      - name: Check dependency consistency
        run: pip check

      - name: Run residual artifact and temporal validation tests
        run: pytest tests/test_residual.py tests/test_validation.py -v --tb=short

  validation-artifact:
    name: Verify Prediction V2 release evidence (Ubuntu / Python 3.12)
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install core validation dependencies
        run: pip install -e ".[dev]"

      - name: Check dependency consistency
        run: pip check

      - name: Verify persisted report and checksummed artifact
        run: python scripts/validate_v2.py --verify-release

      - name: Exercise release-gate contracts
        run: pytest tests/test_validate_v2.py tests/test_validation.py -v --tb=short

      - name: Verify runtime provider loads the packaged core
        run: python -c "from datetime import date; from strathmark.predictor import FilePredictionProvider; b=FilePredictionProvider().snapshot(date(2026,8,11)); assert b.core is not None and b.source == 'package' and b.core.model_version == 'prediction-v2-core-20260207'"

  golden:
    name: Prediction V2 golden (${{ matrix.os }} / Python 3.12)
    runs-on: ${{ matrix.os }}
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install core test dependencies
        run: pip install -e ".[dev]"

      - name: Check dependency consistency
        run: pip check

      - name: Verify normalized public audit output
        run: python scripts/verify_v2_golden.py

  optimizer-capacity:
    name: Optimizer capacity (Ubuntu / Python 3.12)
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install core dependencies
        run: pip install -e .

      - name: Check dependency consistency
        run: pip check

      - name: Enforce 64-competitor optimizer budget
        run: python scripts/benchmark_mark_optimizer.py --output optimizer-capacity-ci.json

      - name: Upload capacity measurement
        uses: actions/upload-artifact@v4
        with:
          name: optimizer-capacity-ubuntu-python312
          path: optimizer-capacity-ci.json

  postgres-migration-rehearsal:
    name: Disposable PostgreSQL migration rehearsal
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: rehearsal
          POSTGRES_PASSWORD: rehearsal-ci-only
          POSTGRES_DB: strathmark_rehearsal_controller
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rehearsal -d strathmark_rehearsal_controller"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      STRATHMARK_RUN_POSTGRES_REHEARSAL: "1"
      STRATHMARK_REHEARSAL_DSN: postgresql://rehearsal:rehearsal-ci-only@127.0.0.1:5432/strathmark_rehearsal_controller
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies and PostgreSQL client
        run: |
          pip install -e ".[dev]"
          sudo apt-get update
          sudo apt-get install --yes postgresql-client

      - name: Exercise migrations 005 and 006 against disposable PostgreSQL
        run: pytest tests/test_postgres_rehearsal.py -v --tb=short

  build:
    name: Installed ${{ matrix.kind }} (${{ matrix.os }} / Python 3.12)
    runs-on: ${{ matrix.os }}
    needs: [lint, test, v3-ocean-boil, api, optional-ml, validation-artifact, golden, optimizer-capacity, postgres-migration-rehearsal]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        kind: [wheel, sdist]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools
        run: pip install build

      - name: Build sdist and wheel
        run: python -m build

      - name: Verify installed distribution outside checkout
        run: python scripts/smoke_installed_distribution.py --kind ${{ matrix.kind }}
