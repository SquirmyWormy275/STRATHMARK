name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ruff
        run: pip install ruff

      - name: Ruff check
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .

  test:
    name: Test (${{ matrix.os }} / Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package with dev extras
        run: pip install -e ".[dev]"

      - name: Run pytest with coverage
        # Supabase-backed db tests are gated behind STRATHMARK_TEST_DB and
        # skip by default. ML predictor paths fall back to baseline when
        # xgboost/lightgbm/sklearn are not installed (they live in the [ml]
        # extra and are not pulled in by [dev]).
        run: pytest tests/ -v --tb=short --cov=strathmark --cov-report=term-missing

  api:
    name: API contract (Ubuntu / Python 3.12)
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package with API test dependencies
        run: pip install -e ".[dev,api]"

      - name: Run API contract tests
        run: pytest tests/test_api.py -v --tb=short

  optional-ml:
    name: Optional ML artifact and promotion gates (Ubuntu / Python 3.12)
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package with optional ML dependencies
        run: pip install -e ".[dev,ml]"

      - name: Run residual artifact and temporal validation tests
        run: pytest tests/test_residual.py tests/test_validation.py -v --tb=short

  validation-artifact:
    name: Verify Prediction V2 release evidence (Ubuntu / Python 3.12)
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install core validation dependencies
        run: pip install -e ".[dev]"

      - name: Verify persisted report and checksummed artifact
        run: python scripts/validate_v2.py --verify-release

      - name: Exercise release-gate contracts
        run: pytest tests/test_validate_v2.py tests/test_validation.py -v --tb=short

      - name: Verify runtime provider loads the packaged core
        run: python -c "from datetime import date; from strathmark.predictor import FilePredictionProvider; b=FilePredictionProvider().snapshot(date(2026,8,11)); assert b.core is not None and b.source == 'package' and b.core.model_version == 'prediction-v2-core-20260207'"

  build:
    name: Build wheel
    runs-on: ubuntu-latest
    needs: [lint, test, api, optional-ml, validation-artifact]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools
        run: pip install build

      - name: Build sdist and wheel
        run: python -m build

      - name: Verify the built wheel in an isolated environment
        run: |
          python -m venv /tmp/strathmark-wheel
          /tmp/strathmark-wheel/bin/python -m pip install --upgrade pip
          WHEEL="$(find "$GITHUB_WORKSPACE/dist" -maxdepth 1 -name '*.whl' -print -quit)"
          test -n "$WHEEL"
          /tmp/strathmark-wheel/bin/python -m pip install "${WHEEL}[api]"
          cd /tmp
          /tmp/strathmark-wheel/bin/python -c "from fastapi.testclient import TestClient; from strathmark.api import app; assert TestClient(app).get('/docs').status_code == 200; print('Built wheel API OK')"
          /tmp/strathmark-wheel/bin/python -c "from datetime import date; from strathmark.predictor import FilePredictionProvider; b=FilePredictionProvider().snapshot(date(2026,8,11)); assert b.core is not None and b.source == 'package'; print('Built wheel Prediction V2 artifact OK')"
