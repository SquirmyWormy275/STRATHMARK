name: Rehearse package on TestPyPI

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Protected annotated pypi-v* tag authorizing an exact v* source tag
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: publication-${{ github.workflow }}-${{ inputs.release_tag }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Verify, build, and rehearse exact release artifacts
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Check out trusted release tooling from main
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          path: release-tools
      - name: Check out the exact authorized tag
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: refs/tags/${{ inputs.release_tag }}
          fetch-depth: 0
          path: release-source
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Verify immutable source and annotated publication authorization
        working-directory: release-source
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: python ../release-tools/scripts/verify_release_tag.py --repository . --tag "$RELEASE_TAG"
      - name: Build and check sdist and wheel
        working-directory: release-source
        run: |
          python -m pip install build twine
          python -m build
          python -m twine check dist/*
      - name: Verify installed wheel outside checkout
        run: python release-tools/scripts/smoke_installed_distribution.py --dist-dir release-source/dist --kind wheel
      - name: Verify installed sdist outside checkout
        run: python release-tools/scripts/smoke_installed_distribution.py --dist-dir release-source/dist --kind sdist
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: strathmark-test-${{ inputs.release_tag }}
          path: release-source/dist/*
          if-no-files-found: error

  extras:
    name: Install every extra declared by the exact wheel
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          path: release-tools
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: strathmark-test-${{ inputs.release_tag }}
          path: dist
      - name: Install and validate core plus artifact-declared extras
        run: python release-tools/scripts/smoke_installed_distribution.py --dist-dir dist --kind wheel --all-extras --smoke core

  publish:
    name: Upload reviewed artifacts to TestPyPI
    needs: [prepare, extras]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: testpypi
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: strathmark-test-${{ inputs.release_tag }}
          path: dist
      - name: Publish exact reviewed artifacts to TestPyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
