name: Publish to PyPI

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Protected annotated pypi-v* tag authorizing an exact v* source tag
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: strathmark-pypi-publication
  cancel-in-progress: false

jobs:
  resolve:
    name: Prepare automatic release after successful main CI
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_repository.full_name == github.repository))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      actions: read
    outputs:
      publish: ${{ steps.release.outputs.publish }}
      release_tag: ${{ steps.release.outputs.release_tag }}
      source_commit: ${{ steps.release.outputs.source_commit }}
      authorization_oid: ${{ steps.release.outputs.authorization_oid }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Resolve exact version and preserve existing immutable tags
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: python -m scripts.prepare_pypi_release

  prepare:
    name: Verify, build, and rehearse exact release artifacts
    needs: resolve
    if: needs.resolve.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Check out trusted release tooling from main
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          path: release-tools

      - name: Check out the exact authorized tag
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: refs/tags/${{ needs.resolve.outputs.release_tag }}
          fetch-depth: 0
          path: release-source

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Verify immutable source and annotated publication authorization
        working-directory: release-source
        env:
          RELEASE_TAG: ${{ needs.resolve.outputs.release_tag }}
          SOURCE_COMMIT: ${{ needs.resolve.outputs.source_commit }}
          AUTHORIZATION_OID: ${{ needs.resolve.outputs.authorization_oid }}
        run: >-
          python ../release-tools/scripts/verify_release_tag.py --repository . --tag "$RELEASE_TAG"
          --commit "$SOURCE_COMMIT" --authorization-oid "$AUTHORIZATION_OID"

      - name: Build and check sdist and wheel
        working-directory: release-source
        run: |
          python -m pip install build twine
          python -m build
          python -m twine check dist/*

      - name: Verify installed wheel outside checkout
        run: python release-tools/scripts/smoke_installed_distribution.py --dist-dir release-source/dist --kind wheel

      - name: Verify installed sdist outside checkout
        run: python release-tools/scripts/smoke_installed_distribution.py --dist-dir release-source/dist --kind sdist

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: strathmark-${{ needs.resolve.outputs.release_tag }}
          path: release-source/dist/*
          if-no-files-found: error

  extras:
    name: Install every extra declared by the exact wheel
    needs: [resolve, prepare]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          path: release-tools
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: strathmark-${{ needs.resolve.outputs.release_tag }}
          path: dist
      - name: Install and validate core plus artifact-declared extras
        run: python release-tools/scripts/smoke_installed_distribution.py --dist-dir dist --kind wheel --all-extras --smoke core

  publish:
    name: Publish reviewed artifacts
    needs: [resolve, prepare, extras]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: pypi
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: strathmark-${{ needs.resolve.outputs.release_tag }}
          path: dist
      - name: Publish exact reviewed artifacts to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1

  verify-published:
    name: Verify public files and install from PyPI
    needs: [resolve, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: strathmark-${{ needs.resolve.outputs.release_tag }}
          path: dist
      - name: Verify indexed artifact hashes and install the exact published version
        env:
          RELEASE_TAG: ${{ needs.resolve.outputs.release_tag }}
        run: |
          for attempt in 1 2 3 4 5 6; do
            if python scripts/verify_pypi_publication.py --dist-dir dist --version "${RELEASE_TAG#pypi-v}"; then
              exit 0
            fi
            if [ "$attempt" -lt 6 ]; then
              echo "PyPI's package index may still be propagating; retrying verification in 15 seconds."
              sleep 15
            fi
          done
          exit 1

  github-release:
    name: Publish matching GitHub Release after PyPI verification
    needs: [resolve, verify-published]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          path: release-tools
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: refs/tags/${{ needs.resolve.outputs.release_tag }}
          fetch-depth: 0
          path: release-source
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: strathmark-${{ needs.resolve.outputs.release_tag }}
          path: dist
      - name: Publish source-bound notes, verified packages and checksums
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.resolve.outputs.release_tag }}
        working-directory: release-tools
        run: |
          for attempt in 1 2 3 4 5 6; do
            if python -m scripts.publish_github_release --source ../release-source \
              --dist-dir ../dist --tag "$RELEASE_TAG" --repository "$GITHUB_REPOSITORY"; then
              exit 0
            fi
            if [ "$attempt" -lt 6 ]; then
              echo "GitHub's release listing may still be propagating; retrying verified publication in 15 seconds."
              sleep 15
            fi
          done
          exit 1
